name: Daily recipe scrape

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC (10:00 Malaysia time)
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scripts/scrape_recipes.py

      - name: Commit updated recipe pool
        run: |
          git config user.name "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add data/recipes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily recipe pool update $(date -u +%F)"
            git push
          fi
